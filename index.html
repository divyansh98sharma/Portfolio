<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Contentsquare analytics tag. Loaded from the static <head> (not React)
         so it is present in the page source and starts collecting immediately.
         On by default; skipped only when the visitor has opted out via the
         cookie banner (analytics-consent="denied" in localStorage). -->
    <script type="text/javascript">
      ;(function () {
        try {
          if (localStorage.getItem('analytics-consent') === 'denied') return
        } catch (e) {
          /* localStorage unavailable — default to loading */
        }
        window._uxa = window._uxa || []
        window._uxa.push(['setPath', window.location.pathname + window.location.hash.replace('#', '?__')])
        var mt = document.createElement('script')
        mt.type = 'text/javascript'
        mt.async = true
        mt.src = '//t.contentsquare.net/uxa/ed2abf2b5708c.js'
        document.getElementsByTagName('head')[0].appendChild(mt)
      })()
    </script>
    <title>Divyansh Sharma - UX Designer Portfolio</title>
    <meta name="description" content="UX Designer portfolio of Divyansh Sharma. Crafting meaningful digital experiences through research-driven design, turning complex problems into intuitive solutions." />

    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://divyanshsharma.work/" />

    <meta property="og:title" content="Divyansh Sharma - UX Designer Portfolio" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Divyansh Sharma",
        "jobTitle": "UX Designer",
        "url": "https://divyanshsharma.work/",

          "https://www.linkedin.com/in/divyansh98sharma",

        ]
      }
    </script>
    <script>
      // Single Page Apps for GitHub Pages: restores the real path after
      // 404.html redirects a deep link (e.g. /case-study-1) back through
      // "/?/case-study-1" — must run before the router reads the URL.
      // https://github.com/rafgraph/spa-github-pages
      ;(function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&')
            })
            .join('?')
          window.history.replaceState(null, '', l.pathname.slice(0, -1) + decoded + l.hash)
        }
      })(window.location)
    </script>
  </head>
  <body>
    <div id="root"></div>
