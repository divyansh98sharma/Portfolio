    <script>
      // Single Page Apps for GitHub Pages: restores the real path after
      // 404.html redirects a deep link (e.g. /case-study-1) back through
      // "/?/case-study-1" — must run before the router reads the URL.
      // https://github.com/rafgraph/spa-github-pages
      ;(function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&')
            })
            .join('?')
          window.history.replaceState(null, '', l.pathname.slice(0, -1) + decoded + l.hash)
        }
      })(window.location)
    </script>
