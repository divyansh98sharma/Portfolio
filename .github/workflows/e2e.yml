name: End-to-end regression

on:
  pull_request:
    branches:
      - main
      - 'integration/**'
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright (Chromium desktop/tablet/mobile + WebKit iPhone)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Official image with Chromium + WebKit and their system libraries
    # preinstalled. Installing them with --with-deps took ~16 of the first
    # run's 21 minutes. Keep the tag equal to the locked @playwright/test version.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build portfolio and generate static routes
        run: npm run build

      - name: Run regression suite
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 14
