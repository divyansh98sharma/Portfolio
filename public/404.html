<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Divyansh Sharma - UX Designer Portfolio</title>
    <script>
      // Single Page Apps for GitHub Pages: GitHub Pages has no server-side
      // rewrite, so a deep link (e.g. /case-study-1) 404s here. Stash the
      // real path in a query string and redirect to "/", where index.html's
      // matching script restores it before the router reads the URL.
      // https://github.com/rafgraph/spa-github-pages
      ;(function (l) {
        l.replace(
          l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + '/?/' +
            l.pathname.slice(1).replace(/&/g, '~and~') +
            (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
            l.hash
        )
      })(window.location)
    </script>
  </head>
  <body></body>
</html>
